    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '供 Apifox、移动端和服务端客户端使用。请求头：Authorization: Bearer <access_token>。 不内置测试 Token，请通过环境变量 {{jwt_token}} 动态获取。'
    CookieJWT:
      type: apiKey
      in: cookie
      name: ziggner_access
      description: 仅供浏览器第一方会话使用。访问与刷新令牌保存在 HttpOnly Cookie；所有写请求还必须携带 X-CSRFToken。 CSRF Token 由登录后 Cookie 自动携带，无需手动配置。
    AdminToken:
      type: apiKey
      in: header
      name: Authorization
      description: '仅后台管理接口使用。请求头：Authorization: Token <admin_token>。'
