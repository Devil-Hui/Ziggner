        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - 用户权限
      security:
      - BearerAuth: []
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
        '400':
          description: 统一错误响应。限流时响应头包含 Retry-After。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
