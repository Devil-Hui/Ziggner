openapi: 3.0.3
info:
  title: Ziggner 商城 API
  version: v1.0.0
  description: 'Ziggner 精选综合商城接口文档。浏览器第一方会话使用 HttpOnly Cookie 与 CSRF；Apifox、移动端和服务端客户端使用 Bearer JWT；后台管理接口使用独立 Admin Token。


    ## 安全导出声明

    - 本文件为脱敏导出：所有示例数据均为虚构，禁止用于生产联调。

    - servers.url 使用 {{base_url}} 占位，导入方需自行配置环境变量。

    - 认证：Bearer JWT / Cookie 会话 / Admin Token 均不内置测试凭据，请通过环境变量动态获取。

    - 不含任何内部运维路径、连接串或云厂商凭据。'
