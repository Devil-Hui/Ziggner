              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: 建议客户端等待的秒数。
              schema:
                type: integer
                minimum: 1
        '500':
          description: 统一错误响应。限流时响应头包含 Retry-After。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      summary: 获取当前用户所有收货地址。首个地址自动设为默认
