components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 活动名称
          maxLength: 200
        type:
          enum:
          - full_reduction
          - percent_off
          - each_full
          type: string
          description: '* `full_reduction` - Full Reduction

            * `percent_off` - Percent Off

            * `each_full` - Each Full'
          x-spec-enum-id: 4a7f5b832f8e57b2
          title: 活动类型
        rule:
          title: 活动规则
        start_time:
