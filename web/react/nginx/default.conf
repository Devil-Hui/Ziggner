# =============================================================================
# Nginx Configuration — Ziggner Frontend + API Gateway
# Handles: Static files (React SPA) + Reverse proxy to Django backend
# =============================================================================

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:4m;
    ssl_session_timeout 10m;

    # ── Hide Nginx version from error pages ───────────────────────────────────
    server_tokens off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://*.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_proxied any;

    # ── Limits ────────────────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn per_ip 100;
    limit_conn_status 429;
    limit_req_status 429;

    location ~ ^/api/(v1/)?users/(session/(login|refresh)|token(/refresh)?|register|login(/code/send)?|refresh|email/(send|verify/send)|social/login)/?$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?promotion/[^/]+/claim/?$ {
        limit_req zone=coupon burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?order/checkout/?$ {
        limit_req zone=checkout burst=8 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?payment/(create|refund|webhook/[^/]+)/?$ {
        limit_req zone=payment burst=8 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
    }

    location ~ ^/api/(v1/)?(goods/upload/image|goods/spu/import|goods/media/spu/[0-9]+/upload|goods/media/spu/[0-9]+/video/upload|support/upload|users/upload-avatar)/?$ {
        limit_req zone=upload burst=6 nodelay;
        # 图片四尺寸 + 商品视频（≤200MB）统一放行；旧 10m 限制导致视频 413/连接中断
        client_max_body_size 220m;
        client_body_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        # 大文件上传 + 对象存储写入耗时较长，避免 nginx 提前断开（ERR_CONNECTION_CLOSED / 502）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 20s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Nginx local health check ──────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Prometheus metrics (from Django) ──────────────────────────────────────
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ── Django static files (CSS/JS for admin, DRF, Swagger UI, etc.) ────────
    # Served directly from shared volume for performance + CSP compliance
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Media files (user uploads) ────────────────────────────────────────────
    location /media/ {
        alias /var/www/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── API proxy to Django backend ───────────────────────────────────────────
    location /api/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保持上游 keep-alive（Connection: close 会强制每次请求后断连，是 ERR_CONNECTION_CLOSED 的常见诱因）
        proxy_set_header Connection "";

        # Timeouts
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;

        # Buffering (off for streaming responses)
        proxy_buffering off;

        # Retry on backend failure
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /ws/ {
        set $upstream_ws web:8001;
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # ── Django admin (optional, uncomment if you need Django Admin UI) ─────────
    # location /django-admin/ {
    #     proxy_pass http://django_backend/admin/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── Django health check (pass-through) ────────────────────────────────────
    location /health/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Cloudflare Pages 托管前端，nginx 仅做 API 代理 ──────────────────────────
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"ziggner-api","docs":"/api/swagger-ui/"}';
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
