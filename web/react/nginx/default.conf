# =============================================================================
# Nginx Configuration — Ziggner Frontend + API Gateway
# Handles: Static files (React SPA) + Reverse proxy to Django backend
# =============================================================================

upstream django_backend {
    # Round-robin to Django Gunicorn instances
    server django-app:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;  # Connection pool to backend
}

server {
    listen 80;
    server_name _;

    # ── Hide Nginx version from error pages ───────────────────────────────────
    server_tokens off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — 仅在 HTTPS 生效时启用（部署时取消注释）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://*.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: https:;
        connect-src 'self' https://challenges.cloudflare.com;
        frame-src 'self' https://challenges.cloudflare.com;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_proxied any;

    # ── Limits ────────────────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # ── Nginx local health check ──────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Prometheus metrics (from Django) ──────────────────────────────────────
    location /metrics {
        proxy_pass http://django_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ── Static assets (content-hashed by Vite, safe to cache aggressively) ────
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    # ── index.html MUST never be cached (new build = new chunk hashes) ────────
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires -1;
    }

    # ── Django static files (CSS/JS for admin, DRF, Swagger UI, etc.) ────────
    # Served directly from shared volume for performance + CSP compliance
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Media files (user uploads) ────────────────────────────────────────────
    location /media/ {
        proxy_pass http://django_backend/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── API proxy to Django backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Buffering (off for streaming responses)
        proxy_buffering off;

        # Retry on backend failure
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ── Django admin (optional, uncomment if you need Django Admin UI) ─────────
    # location /django-admin/ {
    #     proxy_pass http://django_backend/admin/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── Django health check (pass-through) ────────────────────────────────────
    location /health/ {
        proxy_pass http://django_backend/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ── SPA fallback (React client-side routing) ──────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # No cache for index.html (always fetch latest after deploy)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
