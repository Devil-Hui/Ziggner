# =============================================================================
# Ziggner — Main Nginx Configuration
# Overrides the default nginx.conf to set pid in writable /tmp location
# (Container runs as non-root 'nginx' user, /var/run is not writable)
# =============================================================================

# Run as nginx user (already set in Dockerfile)
user nginx;
worker_processes 1;

# ── PID in writable location ──────────────────────────────────────────────────
pid /tmp/nginx.pid;

# ── Error log ─────────────────────────────────────────────────────────────────
error_log /var/log/nginx/error.log warn;

# ── Events ────────────────────────────────────────────────────────────────────
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# ── HTTP ──────────────────────────────────────────────────────────────────────
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=coupon:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=checkout:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    large_client_header_buffers 2 8k;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Include our server config
    include /etc/nginx/conf.d/*.conf;
}
