# =============================================================================
# Ziggner — 根 Compose 入口（本地测试模式）
# 让 `docker compose up` 在仓库根目录开箱可用，无需 -f。
#
# 真正的服务定义见 backend/docker-compose.yml（本地测试配置，无 TLS、无必填 build args）。
# 该配置下的 django 服务会在启动时通过 setup.sh 自动完成：
#   数据库迁移 → 创建超级管理员 → RBAC 角色权限矩阵 → 审核组角色同步
#   → Django 角色组 → 静态资源收集，实现「从 0 初始化完备性」。
#
# 环境变量：默认读取 .env.test（本地测试），DJANGO_ENV=test。
#   本地测试：  docker compose up --build
#   公网部署：  docker compose -f docker-compose.prod.yml --env-file .env.production up --build
# =============================================================================
name: ziggner

include:
  - backend/docker-compose.yml
