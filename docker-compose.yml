# =============================================================================
# Ziggner — 根 Compose 入口（本地开发 / 演示）
# 让 `docker compose up` 在仓库根目录开箱可用，无需 -f。
#
# 真正的服务定义见 backend/docker-compose.yml（dev 配置，无 TLS、无必填 build args）。
# 该配置下的 django 服务会在启动时通过 setup.sh 自动完成：
#   数据库迁移 → 创建超级管理员 → RBAC 角色权限矩阵 → 审核组角色同步
#   → Django 角色组 → 静态资源收集，实现「从 0 初始化完备性」。
#
# 生产部署请用：
#   docker compose -f docker-compose.prod.yml up --build
# （需先就绪：APP_VERSION / GIT_COMMIT / VITE_TURNSTILE_SITE_KEY 与 TLS 证书路径）
# =============================================================================
name: ziggner

include:
  - backend/docker-compose.yml
