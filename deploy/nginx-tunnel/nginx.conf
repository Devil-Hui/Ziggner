server {
    listen 443 ssl;
    http2 on;
    server_name api.ziggner.com;

    ssl_certificate     /etc/nginx/certs/tunnel.crt;
    ssl_certificate_key /etc/nginx/certs/tunnel.key;

    client_max_body_size 10m;

    # API → gunicorn
    location /api/ {
        proxy_pass http://ziggner-web-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # 健康检查 / 其它 → gunicorn（django 的 /health/ 等）
    location /health/ {
        proxy_pass http://ziggner-web-1:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → daphne
    location /ws/ {
        proxy_pass http://ziggner-web-1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://ziggner-web-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
