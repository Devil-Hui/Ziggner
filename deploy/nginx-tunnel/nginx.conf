# =============================================================================
# tunnel-nginx —— Cloudflare Tunnel 入站反代（明文 HTTP）
# =============================================================================
# 关键约束：cloudflared 的 ingress 配置为 `http://localhost:5443`（明文），
# 因此本服务必须在映射端口上提供明文 HTTP。此前本 server 为 `listen 443 ssl`，
# 明文请求打到 HTTPS 端口 → nginx 返回
# "400 The plain HTTP request was sent to HTTPS port"，导致 api.ziggner.com 全站 400。
#
# 回环地址上的 TLS 不带来任何安全收益（cloudflared 与本容器同机），去掉后
# 每个请求少一次 TLS 握手，直接降低首字节时间。
#
# 端口映射见 docker-compose.prod.yml：127.0.0.1:5443:80
# =============================================================================

server {
    listen 80;
    server_name api.ziggner.com _;

    client_max_body_size 10m;

    # Docker 内建 DNS：web 容器重建换 IP 时，nginx 每次请求重新解析 upstream，
    # 避免启动时一次性缓存旧 IP 导致 connection refused → 公网 502。
    # valid=10s 让解析结果缓存 10s（兼顾性能与故障切换速度）；ipv6=off 避免拿到不可路由的 AAAA。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 用变量承载 upstream，强制 nginx 在请求时经 resolver 解析（而非配置加载时写死 IP）。
    # 上游走 nginx:443（真正的站点层）：nginx:80 只承担「明文访问 → 跳 HTTPS」，
    # 它没有 /api/ /static/ /media/ 等 location，若隧道打到 :80 会命中
    # `location / { return 301 https://$host$request_uri; }` 造成公网无限重定向。
    set $upstream_web nginx:443;
    set $upstream_ws   nginx:443;

    # 上游为 HTTPS：源站证书由 nginx 容器的 secret 提供，此处只做回环桥接，
    # 不做证书链校验（同一 docker 网络内，无中间人风险）。
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name api.ziggner.com;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # 注意：nginx 的 proxy_set_header 不支持「部分继承」——只要某个 location 内出现了
    # 任意 proxy_set_header，上层的所有 proxy_set_header 都会被丢弃。因此下面每个
    # location 都必须显式带上 X-Forwarded-Proto https（公网侧由 Cloudflare 终结 TLS，
    # 不写死会让上游按 http 生成重定向/绝对链接）。

    # ── 容器 healthcheck ──────────────────────────────────────────────────────
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── 根路径兜底 ────────────────────────────────────────────────────────────
    # 上游 nginx:80 的 `location /` 是 `return 301 https://$host$request_uri`。
    # 若在此透传该 301，浏览器会再次请求 https://api.ziggner.com/ → 无限重定向。
    # 故根路径由本层直接应答，与 nginx:443 的行为保持一致。
    location = / {
        default_type application/json;
        access_log off;
        return 200 '{"status":"ok","service":"ziggner-api"}';
    }

    # API → gunicorn
    location /api/ {
        proxy_pass https://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
        # web 重启瞬间可能短暂不可达：重试一次同 upstream（解析已是最新 IP）
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # 健康检查 / 其它（含 /templates/ 模板预览静态页）→ nginx:80
    location /health/ {
        proxy_pass https://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket → daphne
    location /ws/ {
        proxy_pass https://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass https://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
