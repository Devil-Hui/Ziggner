server {
    listen 443 ssl;
    http2 on;
    server_name api.ziggner.com;

    ssl_certificate     /etc/nginx/certs/tunnel.crt;
    ssl_certificate_key /etc/nginx/certs/tunnel.key;

    client_max_body_size 10m;

    # Docker 内建 DNS：web 容器重建换 IP 时，nginx 每次请求重新解析 upstream，
    # 避免启动时一次性缓存旧 IP 导致 connection refused → 公网 502。
    # valid=10s 让解析结果缓存 10s（兼顾性能与故障切换速度）；ipv6=off 避免拿到不可路由的 AAAA。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 用变量承载 upstream，强制 nginx 在请求时经 resolver 解析（而非配置加载时写死 IP）
    set $upstream_web nginx:80;
    set $upstream_ws   nginx:80;

    # API → gunicorn
    location /api/ {
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        # web 重启瞬间可能短暂不可达：重试一次同 upstream（解析已是最新 IP）
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # 健康检查 / 其它 → gunicorn
    location /health/ {
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → daphne
    location /ws/ {
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
