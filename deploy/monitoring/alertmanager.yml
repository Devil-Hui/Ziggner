# Ziggner 生产告警路由（Alertmanager）
# SMTP 密码从 /etc/alertmanager/smtp_password 文件读取（compose 挂载，gitignored）。

global:
  smtp_smarthost: 'smtp.163.com:465'
  smtp_from: 'deavenhui@163.com'
  smtp_auth_username: 'deavenhui@163.com'
  smtp_auth_password_file: '/etc/alertmanager/smtp_password'
  smtp_require_tls: false

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    email_configs:
      # 告警邮件统一发到 deaven-hui@ziggner.com
      - to: 'deaven-hui@ziggner.com'
        send_resolved: true
    webhook_configs:
      # 钉钉机器人（配置 DINGTALK_WEBHOOK 并启动 dingtalk-hook 后生效；未配则此路失败不影响邮件）
      - url: 'http://ziggner-dingtalk-hook:8060/dingtalk/webhook/send'
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity=critical']
    target_matchers: ['severity=warning']
    equal: ['alertname']
