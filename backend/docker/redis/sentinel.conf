# Redis Sentinel 配置 — Ziggner 项目
# 监控 redis-master，2 个 sentinel 同意即判定下线

port 26379

# 监控 master: 名称 mymaster，IP redis，端口 6379，quorum=1（单 sentinel 模式）
sentinel monitor mymaster redis 6379 1

# 主观下线判定时间（毫秒）
sentinel down-after-milliseconds mymaster 5000

# 故障转移超时（毫秒）
sentinel failover-timeout mymaster 10000

# 并行同步的 slave 数量
sentinel parallel-syncs mymaster 1

# 日志
logfile ""