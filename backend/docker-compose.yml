services:
  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: ziggner-mysql:dev
    restart: unless-stopped
    env_file: [../.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-backend}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin123456}
    expose: ["3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.4
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7.4.2-alpine
    restart: unless-stopped
    command: >-
      redis-server --port 6379 --maxmemory 96mb
      --maxmemory-policy allkeys-lru --save "" --appendonly no
    expose: ["6379"]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    hostname: web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_TYPE: django
      DJANGO_ENV: dev
      # 本机即生产源站：允许 Cloudflare Tunnel 公网域名访问（api.ziggner.com）
      DJANGO_DEV_ALLOWED_HOSTS: ${DJANGO_DEV_ALLOWED_HOSTS:-api.ziggner.com}
      # 邮件账号池（Gmail，.env 配置，用于验证码发送）
      EMAIL_ACCOUNTS: ${EMAIL_ACCOUNTS:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-backend}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123456}
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: "redis://redis:6379/4"
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      STATIC_ROOT: /backend/static
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-in-prod}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@ziggner.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-change-me-in-prod-123}
    env_file: [../.env]
    ports: ["8000:8000", "8001:8001"]
    volumes:
      - .:/backend
      - media_data:/backend/media
      - static_data:/backend/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery_worker"]
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.5
    environment:
      DJANGO_ENV: dev
      # 邮件账号池（Gmail，.env 配置，验证码异步发送需要）
      EMAIL_ACCOUNTS: ${EMAIL_ACCOUNTS:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-backend}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123456}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      CELERY_CONCURRENCY: "1"
      CELERY_BEAT_ENABLED: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-in-prod}
    volumes:
      - .:/backend
      - media_data:/backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Cloudflare Tunnel 本地源站入口：443 HTTPS 反代 /api/→web:8000、/ws/→web:8001
  # （自签证书在 deploy/nginx-certs/，不入库；cloudflared noTLSVerify 连接）
  tunnel-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ../deploy/nginx-tunnel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../deploy/nginx-certs:/etc/nginx/certs:ro
    depends_on:
      - web
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.1

volumes:
  mysql_data:
  media_data:
  static_data:
