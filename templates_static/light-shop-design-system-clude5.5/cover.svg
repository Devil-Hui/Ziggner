<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Light Shop 设计系统 (Cluade 5.5)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f4f5"/>
      <stop offset="100%" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0b5f3" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c0b5f3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#c0b5f3" opacity="0.10"/>
  <circle cx="120" cy="820" r="200" fill="#c0b5f3" opacity="0.08"/>

  <!-- 浏览器窗口 -->
  <rect x="90" y="150" width="1020" height="560" rx="28" fill="#ffffff"/>
  <rect x="90" y="150" width="1020" height="560" rx="28" fill="none" stroke="#c0b5f3" stroke-opacity="0.35"/>
  <circle cx="146" cy="196" r="10" fill="#c0b5f3" opacity="0.9"/>
  <circle cx="182" cy="196" r="10" fill="#c0b5f3" opacity="0.6"/>
  <circle cx="218" cy="196" r="10" fill="#c0b5f3" opacity="0.35"/>
  <rect x="262" y="182" width="420" height="28" rx="14" fill="#c0b5f3" opacity="0.18"/>

  <!-- Hero -->
  <rect x="150" y="256" width="420" height="34" rx="10" fill="#1b1d22" opacity="0.9"/>
  <rect x="150" y="308" width="330" height="34" rx="10" fill="#1b1d22" opacity="0.55"/>
  <rect x="150" y="372" width="240" height="20" rx="10" fill="#1b1d22" opacity="0.30"/>
  <rect x="150" y="410" width="180" height="60" rx="30" fill="#c0b5f3"/>
  <rect x="700" y="256" width="360" height="240" rx="20" fill="url(#glow)"/>
  <rect x="700" y="256" width="360" height="240" rx="20" fill="none" stroke="#c0b5f3" stroke-opacity="0.4"/>

  <!-- 商品卡 -->
  <rect x="150" y="530" width="270" height="140" rx="18" fill="#c0b5f3" opacity="0.22"/>
  <rect x="450" y="530" width="270" height="140" rx="18" fill="#c0b5f3" opacity="0.16"/>
  <rect x="750" y="530" width="270" height="140" rx="18" fill="#c0b5f3" opacity="0.10"/>

  <!-- 标题 -->
  <text x="90" y="778" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#1b1d22">Light Shop 设计系统 (Cluade 5.5)</text>
  <text x="90" y="828" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="rgba(27,29,34,0.55)">Light Shop Design System (Cluade 5.5)</text>
  <rect x="90" y="852" width="300" height="40" rx="20" fill="#c0b5f3"/>
  <text x="118" y="879" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff">Light Shop</text>
</svg>
