<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Bevel 设计风格参考模板">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222326"/>
      <stop offset="100%" stop-color="#3d4a63"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffca00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffca00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#ffca00" opacity="0.10"/>
  <circle cx="120" cy="820" r="200" fill="#ffca00" opacity="0.08"/>

  <!-- 浏览器窗口 -->
  <rect x="90" y="150" width="1020" height="560" rx="28" fill="rgba(255,255,255,0.12)"/>
  <rect x="90" y="150" width="1020" height="560" rx="28" fill="none" stroke="#ffca00" stroke-opacity="0.35"/>
  <circle cx="146" cy="196" r="10" fill="#ffca00" opacity="0.9"/>
  <circle cx="182" cy="196" r="10" fill="#ffca00" opacity="0.6"/>
  <circle cx="218" cy="196" r="10" fill="#ffca00" opacity="0.35"/>
  <rect x="262" y="182" width="420" height="28" rx="14" fill="#ffca00" opacity="0.18"/>

  <!-- Hero -->
  <rect x="150" y="256" width="420" height="34" rx="10" fill="#ffffff" opacity="0.9"/>
  <rect x="150" y="308" width="330" height="34" rx="10" fill="#ffffff" opacity="0.55"/>
  <rect x="150" y="372" width="240" height="20" rx="10" fill="#ffffff" opacity="0.30"/>
  <rect x="150" y="410" width="180" height="60" rx="30" fill="#ffca00"/>
  <rect x="700" y="256" width="360" height="240" rx="20" fill="url(#glow)"/>
  <rect x="700" y="256" width="360" height="240" rx="20" fill="none" stroke="#ffca00" stroke-opacity="0.4"/>

  <!-- 商品卡 -->
  <rect x="150" y="530" width="270" height="140" rx="18" fill="#ffca00" opacity="0.22"/>
  <rect x="450" y="530" width="270" height="140" rx="18" fill="#ffca00" opacity="0.16"/>
  <rect x="750" y="530" width="270" height="140" rx="18" fill="#ffca00" opacity="0.10"/>

  <!-- 标题 -->
  <text x="90" y="778" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Bevel 设计风格参考模板</text>
  <text x="90" y="828" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="rgba(255,255,255,0.62)">Bevel Design Style Reference</text>
  <rect x="90" y="852" width="220" height="40" rx="20" fill="#ffca00"/>
  <text x="118" y="879" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1b1d22">Bevel</text>
</svg>
