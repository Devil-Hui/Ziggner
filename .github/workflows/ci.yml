# =============================================================================
# Ziggner CI —— 大厂「质量内建、分层覆盖、失败阻断」门禁
#
# 触发：
#   - push master/main / PR：全量分层测试（任何失败直接阻断合并）
#   - schedule 每日 20:00 UTC（北京 04:00）：全量回归 + Allure 报告推钉钉群
#
# 门禁矩阵：
#   backend-unit        单元层（领域/服务逻辑）   覆盖率 ≥24%（里程碑，目标 85%）
#   backend-integration 集成层（ORM/缓存/隔离）   覆盖率 ≥39%（里程碑，目标 80%）
#   backend-full        全量累计（含混沌 slow）  覆盖率 ≥42% + 核心模块门禁（目标 95%）
#   backend-contract    契约层（OpenAPI 基线）    破坏性变更阻断
#   backend-slow        混沌/并发层              防超卖/一致性断言；失败自动生成 JIRA 工单
#   frontend            前端 eslint/tsc/vitest 覆盖率门禁
#   frontend-e2e        Playwright 公网冒烟（允许失败，抖动容忍）
#   perf-gate           性能基线（见 perf-gate.yml，P95>500ms 或 TPS<80% → WARNING 强制人工 Review）
#   nightly-regression  每日凌晨全量 + Allure + 钉钉
# =============================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # 每日凌晨回归（UTC 20:00 = 北京时间 04:00）
    - cron: '0 20 * * *'

env:
  DJANGO_SETTINGS_MODULE: project.config.settings.dev
  DB_ENGINE: django.db.backends.mysql
  DB_NAME: ziggner_test
  DB_USER: root
  DB_PASSWORD: ""
  DB_HOST: 127.0.0.1
  DB_PORT: "3306"
  REDIS_URL: redis://127.0.0.1:6379/1
  REDIS_SLAVE_URL: redis://127.0.0.1:6379/1
  CELERY_BROKER_URL: redis://127.0.0.1:6379/2
  DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
  ENABLE_MOCK_PAYMENT: "true"
  FILE_STORAGE: local

# MySQL/Redis 测试服务（集成/契约/混沌/全量共用；与生产同镜像大版本）
services: &services
  mysql:
    image: mysql:8.0
    env:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ziggner_test
    ports: ["3306:3306"]
    options: >-
      --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 10s --health-timeout 5s --health-retries 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    options: >-
      --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10

jobs:
  # ───────────────────────────── 单元层 ─────────────────────────────
  backend-unit:
    name: Backend · Unit (cov≥24%)
    runs-on: ubuntu-latest
    services: *services
    steps:
      - uses: ./.github/actions/backend-setup
      - name: Unit tests (domain/service logic)
        working-directory: backend
        run: |
          python -m pytest -m 'unit and not slow' --strict-markers --tb=short -q \
            --cov --cov-config=.coveragerc-unit --cov-report=term-missing --cov-fail-under=24

  # ──────────────────────────── 集成层 ──────────────────────────────
  backend-integration:
    name: Backend · Integration (cov≥39%)
    runs-on: ubuntu-latest
    services: *services
    steps:
      - uses: ./.github/actions/backend-setup
      - name: Integration tests (ORM/cache/isolation)
        working-directory: backend
        run: |
          python -m pytest -m 'integration and not slow' --strict-markers --tb=short -q \
            --reuse-db --cov --cov-config=.coveragerc-integration --cov-report=term-missing \
            --cov-fail-under=39

  # ───────────────── 全量累计（含混沌 slow）+ 核心模块门禁 ────────────
  backend-full:
    name: Backend · Full (cov≥42%) + Core gate
    runs-on: ubuntu-latest
    services: *services
    steps:
      - uses: ./.github/actions/backend-setup
      - name: Full suite (unit + integration + slow)
        working-directory: backend
        run: |
          python -m pytest -m 'not e2e' --strict-markers --tb=short -q --reuse-db \
            --cov --cov-config=.coveragerc-integration --cov-report=term-missing \
            --cov-fail-under=42
      - name: Core module coverage gate (库存扣减/价格计算/状态机, 目标 95%)
        working-directory: backend
        run: |
          coverage json -o coverage.json
          python scripts/check_core_coverage.py

  # ──────────────────────────── 契约层 ──────────────────────────────
  backend-contract:
    name: Backend · Contract (breaking-change guard)
    runs-on: ubuntu-latest
    services: *services
    steps:
      - uses: ./.github/actions/backend-setup
      - name: Contract tests (OpenAPI baseline diff)
        working-directory: backend
        run: |
          python -m pytest -m contract --strict-markers --tb=short -q --reuse-db

  # ─────────────────────── 混沌/并发层（slow）────────────────────────
  backend-slow:
    name: Backend · Chaos/Concurrency (no-oversell)
    runs-on: ubuntu-latest
    services: *services
    steps:
      - uses: ./.github/actions/backend-setup
      - name: Chaos & concurrency tests
        working-directory: backend
        run: |
          python -m pytest -m 'slow' --strict-markers --tb=short -q --reuse-db -n 1 || {
            echo "::error::混沌/并发测试失败（可能超卖或数据不一致）"
            python scripts/chaos_fail_issue.py \
              --subject "[CI] 混沌测试失败：并发下单数据一致性" \
              --body "详见 GitHub Actions 日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              || true
            exit 1
          }

  # ──────────────────────────── 前端 ────────────────────────────────
  frontend:
    name: Frontend · lint/tsc/vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/react/package-lock.json
      - name: Install dependencies
        working-directory: web/react
        run: npm ci
      - name: Lint (eslint)
        working-directory: web/react
        run: npm run lint
      - name: Type check (tsc)
        working-directory: web/react
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test (vitest + coverage)
        working-directory: web/react
        run: npx vitest run --coverage

  # ────────────── 前端 E2E（公网目标，抖动容忍）──────────────────────
  frontend-e2e:
    name: Frontend · E2E (Playwright, public)
    runs-on: ubuntu-latest
    continue-on-error: true  # 公网目标（shop.ziggner.com）偶发抖动，不阻断合并；结果人工复核
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/react/package-lock.json
      - name: Install dependencies + chromium
        working-directory: web/react
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E storefront smoke
        working-directory: web/react
        env:
          E2E_BASE_URL: https://shop.ziggner.com
        run: npx playwright test --project=chromium

  # ─────────────────────── 每日凌晨全量回归 ──────────────────────────
  nightly-regression:
    name: Nightly · Full regression + Allure → DingTalk
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services: *services
    steps:
      - uses: ./.github/actions/backend-setup
      - name: Install allure toolchain
        working-directory: backend
        run: pip install allure-pytest allure-commandline
      - name: Full regression (all layers) + Allure
        working-directory: backend
        run: |
          python -m pytest -m 'not e2e' --strict-markers --tb=short -q --reuse-db \
            --alluredir=allure-results \
            --cov --cov-config=.coveragerc-integration --cov-report=term-missing \
            --cov-fail-under=42 || true   # 回归报告不阻断（门禁由上面各 job 负责）
          python -m pytest -m contract --strict-markers --tb=short -q --reuse-db \
            --alluredir=allure-results || true
      - name: Allure report + DingTalk push
        working-directory: backend
        run: |
          allure generate allure-results -o allure-report --clean || true
          cat > allure-summary.md <<EOF
          ## Ziggner 每日回归报告
          - 时间: $(date -u +'%Y-%m-%d %H:%M UTC')
          - 提交: ${{ github.sha }}
          - 结果: 见 Allure 报告附件（job artifacts）
          - 门禁: unit≥24% / integration≥39% / full≥42%（分别由 CI job 保证）
          - 契约基线: backend/contracts/schemas/openapi.baseline.json
          EOF
          python scripts/notify_dingtalk.py "Ziggner 每日回归 $(date -u +%Y-%m-%d)" "$(cat allure-summary.md)"
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: backend/allure-report
          retention-days: 14
