name: backend-setup
description: Checkout + Python 3.12 + backend 依赖安装（各测试 job 共用）

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements/base.txt
    - name: Install dependencies
      working-directory: backend
      shell: bash
      run: |
        pip install --upgrade pip
        pip install -r requirements/base.txt -r requirements/test.txt ruff bandit
