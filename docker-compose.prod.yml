x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-healthcheck: &healthcheck
  interval: 20s
  timeout: 5s
  retries: 3
  start_period: 30s

x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true

# =============================================================================
# 资源预算（2 vCPU / 4GB RAM 主机）
# 设计目标：任意负载下 CPU 硬上限之和 = 1.40 vCPU = 70% of 2.0，保证峰值 ≤70%。
# 内存硬上限之和 ≈ 1.86GB（< 70% of 4GB = 2.8GB）。gunicorn 2×gevent 协程 worker 为内存安全取向。
# 注意：cpus 为 Docker 硬上限（--cpus），即使满载也不会突破该比例；真实利用率取决于流量。
# =============================================================================
services:
  nginx:
    build:
      context: ./web/react
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
        GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY is required}
    image: ziggner-nginx:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - tls_cert
      - tls_key
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/log/nginx:size=8m,uid=101,gid=101
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, internal]
    mem_limit: 64m
    mem_reservation: 32m
    memswap_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
        GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
    image: ziggner-django:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_TYPE: django
      DJANGO_ENV: prod
      DAPHNE_PORT: "8001"
      AWS_REGION: ${AWS_REGION:-auto}
      STATIC_ROOT: /app/static
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: "redis://redis:6379/4"
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      # 2C4G：固定 2 个 gevent 协程 worker，max-requests=1000 防内存泄漏
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "1"
      GUNICORN_WORKER_CLASS: gevent
      GUNICORN_MAX_REQUESTS: "1000"
      GUNICORN_MAX_REQUESTS_JITTER: "100"
      GUNICORN_TIMEOUT: "300"
      GUNICORN_GRACEFUL_TIMEOUT: "30"
      # gevent 协程需纯 Python DB 驱动（mysqlclient 为 C 扩展，gevent 无法协作式调度其 socket）
      DJANGO_DB_DRIVER: "pymysql"
    env_file: [.env.production]
    volumes:
      - media_data:/app/media
      - static_data:/app/static
      - django_logs:/app/logs
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, egress]
    mem_limit: 544m
    mem_reservation: 384m
    memswap_limit: 544m
    cpus: "0.50"
    pids_limit: 96
    <<: *app-security
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ >/dev/null && curl -fsS http://127.0.0.1:8001/health/ >/dev/null"]
      <<: *healthcheck
      start_period: 45s

  celery-worker:
    image: ziggner-django:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_TYPE: celery_worker
      DJANGO_ENV: prod
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      # gevent 协程需纯 Python DB 驱动
      DJANGO_DB_DRIVER: "pymysql"
      CELERY_CONCURRENCY: "1"
      # 2C4G：单一 worker（concurrency=1）承载高优队列；image_process 跑 R2 上传（受全局信号量 ≤3 并发）。
      # batch_import/ranking 为周期性缓存预热任务，essential 保留在同一 worker，避免在 2C4G 上再起第二个 worker 抢内存。
      CELERY_QUEUE: default,image_process,batch_import,ranking
      CELERY_MAX_TASKS_PER_CHILD: "40"
      CELERY_MAX_MEMORY_PER_CHILD: "160000"
      CELERY_TASK_SOFT_TIME_LIMIT: "240"
      CELERY_TASK_TIME_LIMIT: "300"
    env_file: [.env.production]
    volumes:
      - media_data:/app/media
      - celery_logs:/app/logs
      - backup_data:/backups
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, egress]
    mem_limit: 256m
    mem_reservation: 160m
    memswap_limit: 256m
    cpus: "0.20"
    pids_limit: 48
    <<: *app-security
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*worker' >/dev/null"]
      <<: *healthcheck

  celery-beat:
    image: ziggner-django:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICE_TYPE: celery_beat
      DJANGO_ENV: prod
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      DJANGO_DB_DRIVER: "pymysql"
    env_file: [.env.production]
    volumes:
      - beat_logs:/app/logs
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    mem_limit: 192m
    mem_reservation: 128m
    memswap_limit: 192m
    cpus: "0.05"
    pids_limit: 32
    <<: *app-security
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*beat' >/dev/null"]
      <<: *healthcheck

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >-
      redis-server --port 6379 --maxmemory 128mb
      --maxmemory-policy allkeys-lru --save "" --appendonly no
      --tcp-backlog 128 --timeout 60
    expose: ["6379"]
    tmpfs:
      - /data:size=8m,uid=999,gid=999
    networks: [internal]
    mem_limit: 96m
    mem_reservation: 64m
    memswap_limit: 96m
    cpus: "0.10"
    pids_limit: 24
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    build:
      context: ./backend/mysql
      dockerfile: Dockerfile
    image: ziggner-mysql:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-ziggner}
      MYSQL_USER: ${DB_USER:-ziggner}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose: ["3306"]
    networks: [internal]
    mem_limit: 640m
    mem_reservation: 384m
    memswap_limit: 640m
    cpus: "0.40"
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    command:
      - --innodb-buffer-pool-size=384M
      # 连接数上限：2 个 gunicorn worker(各池≤15) + celery(≤15) + daphne/beat 留余量
      - --max-connections=60
      - --performance-schema=OFF
      - --local-infile=OFF
      # 慢查询阈值 500ms（2C4G：实时联表聚合/未命中索引的查询会被记录，便于定位）
      - --slow-query-log=ON
      - --long-query-time=0.5
      - --log-queries-not-using-indexes=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  tunnel-nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5443:443"
    volumes:
      - ./deploy/nginx-tunnel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-certs:/etc/nginx/certs:ro
    depends_on:
      - nginx
    networks: [internal]
    mem_limit: 64m
    mem_reservation: 32m
    memswap_limit: 64m
    cpus: "0.05"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/log/nginx:size=8m,uid=101,gid=101
      - /run:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  mysql_data:
  media_data:
  static_data:
  django_logs:
  celery_logs:
  beat_logs:
  backup_data:

secrets:
  tls_cert:
    file: ${TLS_CERT_PATH:?TLS_CERT_PATH is required}
  tls_key:
    file: ${TLS_KEY_PATH:?TLS_KEY_PATH is required}

networks:
  edge:
  egress: {}
  internal:
    internal: true

